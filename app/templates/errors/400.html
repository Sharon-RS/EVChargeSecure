{% extends "base.html" %}

{% block title %}400 - Bad Request{% endblock %}
{% block page_heading %}400 Bad Request{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 3rem 2rem;">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚠️</div>
    <h2 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 0.75rem;">Invalid Request Syntax</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">
        The parameters submitted to the server failed structural or security validation checks.
    </p>
    <a href="{{ url_for('user.dashboard') }}" class="btn btn-primary">Return to Safety</a>
</div>
{% endblock %}
