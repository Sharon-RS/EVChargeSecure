name: EVChargeSecure CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-scan:
    name: Unit & Security Tests (pytest, Bandit, pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Automated Test Suite
        env:
          FLASK_ENV: testing
          LAB_VULN_DEMO_ENABLED: "true"
        run: |
          pytest -v

      - name: Run Bandit SAST Security Linter
        run: |
          bandit -r app/ -c bandit.yaml

      - name: Run pip-audit Dependency Vulnerability Scan
        run: |
          pip-audit -r requirements.txt

  docker-and-k8s:
    name: Container Build & Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    needs: test-and-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: evchargesecure:ci-test

      - name: Install kubectl for Manifest Validation
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

       - name: Validate Kubernetes Manifests (Offline Client Validation)
        run: |
          echo "Validating k8s manifests..."
          kubectl apply --dry-run=client --validate=false -f k8s/namespace.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/secret.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/configmap.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/deployment.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/service.yaml
          echo "All Kubernetes manifests successfully validated!"
